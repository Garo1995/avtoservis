<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Автомобиль на диагностике в автосервисе">
  <defs>
    <radialGradient id="glow" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#ff6a13" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff6a13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a525e"/>
      <stop offset="1" stop-color="#1d2128"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc0e3" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2c3d52" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a13" stop-opacity="0"/>
      <stop offset=".85" stop-color="#ff6a13" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb185" stop-opacity=".9"/>
    </linearGradient>
    <path id="shape" d="M70 318C62 318 56 312 57 304L62 268C64 252 74 244 90 241L150 228C170 205 205 178 250 164C300 150 380 148 430 160C470 170 500 195 520 222L560 232C582 238 590 250 592 270L596 304C597 312 590 318 582 318Z"/>
    <clipPath id="clip"><use href="#shape"/></clipPath>
    <g id="wheel">
      <circle r="52" fill="#0b0c0e"/>
      <circle r="44" fill="#17191d"/>
      <circle r="30" fill="#c3cad3"/>
      <g class="spin" stroke="#2a2f37" stroke-width="7" stroke-linecap="round">
        <path d="M0 -22V22M-21 -7L21 7M21 -7L-21 7"/>
        <circle r="26" fill="none" stroke="#9aa3af" stroke-width="2"/>
      </g>
      <circle r="8" fill="#ff6a13"/>
    </g>
  </defs>
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite; }
    .beam { animation: scan 4.5s ease-in-out infinite alternate; }
    .lamp { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes scan { from { transform: translateX(-60px); } to { transform: translateX(700px); } }
    @keyframes pulse { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .spin, .beam, .lamp { animation: none; } }
  </style>

  <ellipse cx="320" cy="230" rx="310" ry="195" fill="url(#glow)"/>
  <circle cx="320" cy="215" r="196" fill="none" stroke="#ff6a13" stroke-opacity=".18" stroke-dasharray="3 9" stroke-width="2"/>
  <circle cx="320" cy="215" r="150" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  <ellipse cx="322" cy="366" rx="262" ry="16" fill="#000" opacity=".5"/>

  <use href="#shape" fill="url(#body)"/>
  <path d="M168 226C188 203 214 186 246 177L296 173V226Z" fill="url(#glass)"/>
  <path d="M316 172L420 171C452 178 478 198 496 226H316Z" fill="url(#glass)"/>
  <path d="M296 226V312M316 226V312" stroke="#0f1114" stroke-opacity=".55" stroke-width="2"/>
  <path d="M64 262L592 266" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
  <rect x="270" y="244" width="20" height="5" rx="2.5" fill="#cfd5dd" fill-opacity=".6"/>
  <rect x="326" y="244" width="20" height="5" rx="2.5" fill="#cfd5dd" fill-opacity=".6"/>
  <path d="M566 247L592 252L594 263L572 263Z" fill="#ffd9bf"/>
  <path class="lamp" d="M566 247L592 252L594 263L572 263Z" fill="#ff6a13"/>
  <path d="M58 262H74V276H60Z" fill="#ff3b30"/>

  <g clip-path="url(#clip)">
    <rect class="beam" x="-60" y="130" width="60" height="200" fill="url(#beam)"/>
  </g>

  <circle cx="165" cy="318" r="56" fill="#0b0c0e"/>
  <circle cx="485" cy="318" r="56" fill="#0b0c0e"/>
  <use href="#wheel" x="165" y="318"/>
  <use href="#wheel" x="485" y="318"/>

  <g fill="none" stroke="#ff6a13" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M522 96h58M522 96v14M580 96v14"/>
    <path d="M60 120h46M60 120v12"/>
  </g>
  <g fill="#ff6a13">
    <circle cx="548" cy="128" r="4"/>
    <circle cx="86" cy="150" r="4" opacity=".6"/>
    <circle cx="590" cy="164" r="3" opacity=".5"/>
  </g>
</svg>
